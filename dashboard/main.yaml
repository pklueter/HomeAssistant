      text_only: true
      grid_options:
        columns: full
      content: |
        {% set l5 = (state_attr('sensor.kafertal_bensheimer_strasse', 'departures') or []) | selectattr('line', 'eq', 'RNV 5') | list %}
        {% if l5 %}
        | Abfahrt | | Richtung | Bstg. |
        |:--|:--|:--|:-:|
        {% for d in l5 %}| **{{ d.departure_time }}**{% if d.delay > 0 %} (+{{ d.delay }}){% endif %} | {{ 'jetzt' if d.minutes_until_departure < 1 else 'in ' ~ d.minutes_until_departure ~ ' min' }} | {{ d.destination }} | {{ d.platform }} |
        {% endfor %}
        {% else %}
        Derzeit keine Abfahrten der Linie 5.
        {% endif %}
