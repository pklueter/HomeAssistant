              - condition: state
                entity: valve.rasenbewasserung_gross
                state: open
              - condition: state
                entity: valve.rasenbewasserung_klein_switch
                state: open
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Läuft gerade
            icon: mdi:play-circle-outline
            styles: >-
              * { --bubble-accent-color: #FFB300 !important; --accent-color:
