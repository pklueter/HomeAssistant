              - entity: calendar.philipp
                label: person.philipp_kluter
                accent_color: home-assistant
              - entity: calendar.privat
                label: person.laura_heimen
                accent_color: home-assistant
              - entity: calendar.arbeit
                label: 🎒
                accent_color: home-assistant
              - entity: calendar.schulferien_mannheim
                label: 🏖️
                accent_color: home-assistant
            days_to_show: 7
            compact_events_to_show: 6
            allday_badge: title
            show_location: false
            type: custom:calendar-card-pro
            grid_options:
              columns: full
            theme: waves
            tap_action:
              action: expand
          - type: markdown
            text_only: true
            content: "&nbsp;"
            grid_options:
              columns: full
              rows: auto
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Wetter
            icon: mdi:weather-partly-cloudy
            styles: >-
              * { --bubble-accent-color: #FFB300 !important; --accent-color:
