              columns: full
              rows: 1
            tap_action:
              action: none
            icon_tap_action:
              action: none
            visibility:
              - condition: state
                entity: sensor.anzahl_warnungen
                state: "0"
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Offene Türen & Fenster
            icon: mdi:window-open-variant
            grid_options:
              columns: full
            visibility:
              - condition: or
                conditions:
                  - condition: state
                    entity: binary_sensor.tursensor_seitentur_opening
                    state: "on"
                  - condition: state
                    entity: binary_sensor.tursensor_terassentur_opening
                    state: "on"
                  - condition: state
                    entity: binary_sensor.fenstersensor_kuche_opening
                    state: "on"
                  - condition: state
                    entity: binary_sensor.fenstersensor_schlafzimmer_opening
                    state: "on"
                  - condition: state
                    entity: binary_sensor.fenstersensor_philipps_buro_opening
                    state: "on"
                  - condition: state
                    entity: binary_sensor.fenstersensor_bad_1_og_opening
                    state: "on"
                  - condition: state
                    entity: binary_sensor.fenstersensor_bad_dg_opening
                    state: "on"
                  - condition: state
                    entity: binary_sensor.fenster_lauras_buro
                    state: "on"
                  - condition: state
                    entity: binary_sensor.fenster_sportzimmer
                    state: "on"
                  - condition: state
                    entity: binary_sensor.dachboden_dachbodentur_tur
                    state: "on"
