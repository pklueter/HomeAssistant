                - entity: binary_sensor.alle_turen
                  icon: mdi:door-open
                  show_background: false
                  visibility:
                    - condition: state
                      entity: binary_sensor.alle_turen
                      state: "on"
                - entity: binary_sensor.alle_fenster
                  icon: mdi:window-open-variant
                  show_background: false
                  visibility:
                    - condition: state
                      entity: binary_sensor.alle_fenster
                      state: "on"
                - icon: mdi:chevron-right
                  show_background: false
                  tap_action:
                    action: navigate
                    navigation_path: "#tueren-fenster"
            styles: >-
              * { --bubble-accent-color: #FFB300 !important; --accent-color:
