title: Home
views:
  - title: Übersicht
    path: uebersicht
    icon: mdi:home-variant
    type: sections
    max_columns: 3
    badges:
      - type: entity
        entity: person.philipp_kluter
        show_entity_picture: true
      - type: entity
        entity: person.laura_heimen
        show_entity_picture: true
      - type: entity
        entity: weather.forecast_home
      - type: entity
        entity: sensor.eve_weather_20ebs9901_temperatur
        name: Außen
        icon: mdi:thermometer
        show_name: true
        show_state: true
        show_icon: true
      - type: entity
        entity: sensor.nachste_linie_5
        name: Linie 5
        icon: mdi:tram
        show_name: true
        show_state: true
        show_icon: true
        tap_action:
          action: navigate
          navigation_path: "#opnv"
        visibility:
          - condition: time
            after: "06:00:00"
            before: "09:00:00"
            weekdays:
              - mon
              - tue
              - wed
              - thu
              - fri
      - type: entity
        entity: sensor.heizende_raume
        name: Heizt
        icon: mdi:radiator
        color: deep-orange
        show_name: true
        show_state: true
        show_icon: true
        tap_action:
          action: navigate
          navigation_path: "#heizung"
        visibility:
          - condition: numeric_state
            entity: sensor.heizende_raume
            above: 0
      - type: entity
        entity: sensor.ecu_216000266768_current_power
        name: PV
        icon: mdi:solar-power
        color: amber
        show_name: false
        show_state: true
        show_icon: true
        tap_action:
          action: navigate
          navigation_path: /dashboard-dg/dg
        visibility:
          - condition: numeric_state
            entity: sensor.ecu_216000266768_current_power
            above: 0
      - type: entity
        entity: input_boolean.urlaubsmodus
        name: Urlaubsmodus
        icon: mdi:airplane
        color: orange
        show_name: true
        show_state: false
        show_icon: true
        visibility:
          - condition: state
            entity: input_boolean.urlaubsmodus
            state: "on"
      - type: entity
        entity: calendar.schulferien_mannheim
        name: Schulferien
        icon: mdi:school-outline
        show_name: true
        show_state: true
        show_icon: true
        state_content:
          - message
          - start_time
        tap_action:
          action: navigate
          navigation_path: "#kalender"
      - type: entity
        entity: binary_sensor.twinguard_flur_smoke
        name: Rauch Flur
        color: red
        show_name: true
        show_state: false
        show_icon: true
        visibility:
          - condition: state
            entity: binary_sensor.twinguard_flur_smoke
            state: "on"
      - type: entity
        entity: binary_sensor.twinguard_schlafzimmer_smoke
        name: Rauch Schlafzimmer
        color: red
        show_name: true
        show_state: false
        show_icon: true
        visibility:
          - condition: state
            entity: binary_sensor.twinguard_schlafzimmer_smoke
            state: "on"
      - type: entity
        entity: binary_sensor.wohnzimmer_twinguard_smoke
        name: Rauch Wohnzimmer
        color: red
        show_name: true
        show_state: false
        show_icon: true
        visibility:
          - condition: state
            entity: binary_sensor.wohnzimmer_twinguard_smoke
            state: "on"
      - type: entity
        entity: sensor.pollenflug_mannheim_ambrosia
        name: Ambrosia
        icon: mdi:flower-pollen
        color: amber
        show_name: true
        show_state: true
        show_icon: true
        visibility:
          - condition: numeric_state
            entity: sensor.pollenflug_mannheim_ambrosia
            above: 0
      - type: entity
        entity: sensor.pollenflug_mannheim_beifuss
        name: Beifuß
        icon: mdi:flower-pollen
        color: amber
        show_name: true
        show_state: true
        show_icon: true
        visibility:
          - condition: numeric_state
            entity: sensor.pollenflug_mannheim_beifuss
            above: 0
      - type: entity
        entity: sensor.pollenflug_mannheim_birke
        name: Birke
        icon: mdi:flower-pollen
        color: amber
        show_name: true
        show_state: true
        show_icon: true
        visibility:
          - condition: numeric_state
            entity: sensor.pollenflug_mannheim_birke
            above: 0
      - type: entity
        entity: sensor.pollenflug_mannheim_erle
        name: Erle
        icon: mdi:flower-pollen
        color: amber
        show_name: true
        show_state: true
        show_icon: true
        visibility:
          - condition: numeric_state
            entity: sensor.pollenflug_mannheim_erle
            above: 0
      - type: entity
        entity: sensor.pollenflug_mannheim_esche
        name: Esche
        icon: mdi:flower-pollen
        color: amber
        show_name: true
        show_state: true
        show_icon: true
        visibility:
          - condition: numeric_state
            entity: sensor.pollenflug_mannheim_esche
            above: 0
      - type: entity
        entity: sensor.pollenflug_mannheim_graser
        name: Gräser
        icon: mdi:flower-pollen
        color: amber
        show_name: true
        show_state: true
        show_icon: true
        visibility:
          - condition: numeric_state
            entity: sensor.pollenflug_mannheim_graser
            above: 0
      - type: entity
        entity: sensor.pollenflug_mannheim_hasel
        name: Hasel
        icon: mdi:flower-pollen
        color: amber
        show_name: true
        show_state: true
        show_icon: true
        visibility:
          - condition: numeric_state
            entity: sensor.pollenflug_mannheim_hasel
            above: 0
      - type: entity
        entity: sensor.pollenflug_mannheim_roggen
        name: Roggen
        icon: mdi:flower-pollen
        color: amber
        show_name: true
        show_state: true
        show_icon: true
        visibility:
          - condition: numeric_state
            entity: sensor.pollenflug_mannheim_roggen
            above: 0
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Warnungen
            icon: mdi:alert-circle-outline
            sub_button:
              main:
                - entity: sensor.anzahl_warnungen
                  show_background: false
                  state_content: state
                  visibility:
                    - condition: numeric_state
                      entity: sensor.anzahl_warnungen
                      above: 0
            styles: >-
              * { --bubble-accent-color: #FFB300 !important; --accent-color:
              #FFB300 !important; --bubble-climate-accent-color: #FFB300
              !important; }
          - type: tile
            entity: binary_sensor.twinguard_flur_smoke
            name: Rauchalarm Flur
            icon: mdi:fire-alert
            color: red
            state_content: last_changed
            grid_options:
              columns: full
              rows: 1
            visibility:
              - condition: state
                entity: binary_sensor.twinguard_flur_smoke
                state: "on"
          - type: tile
            entity: binary_sensor.twinguard_schlafzimmer_smoke
            name: Rauchalarm Schlafzimmer
            icon: mdi:fire-alert
            color: red
            state_content: last_changed
            grid_options:
              columns: full
              rows: 1
            visibility:
              - condition: state
                entity: binary_sensor.twinguard_schlafzimmer_smoke
                state: "on"
          - type: tile
            entity: binary_sensor.wohnzimmer_twinguard_smoke
            name: Rauchalarm Wohnzimmer
            icon: mdi:fire-alert
            color: red
            state_content: last_changed
            grid_options:
              columns: full
              rows: 1
            visibility:
