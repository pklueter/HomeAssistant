title: Erdgeschoss
views:
  - title: Erdgeschoss
    path: eg
    icon: mdi:home-floor-0
    type: sections
    max_columns: 3
    dense_section_placement: false
    top_margin: false
    badges:
      - type: entity
        entity: person.philipp_kluter
        show_entity_picture: true
      - type: entity
        entity: person.laura_heimen
        show_entity_picture: true
      - type: entity
        entity: weather.forecast_home
      - type: entity
        entity: sensor.ecu_216000266768_current_power
        name: PV
        icon: mdi:solar-power
        color: amber
        show_name: false
        show_state: true
        show_icon: true
        tap_action:
          action: navigate
          navigation_path: /dashboard-dg/dg
        visibility:
          - condition: numeric_state
            entity: sensor.ecu_216000266768_current_power
            above: 0
      - type: entity
        entity: lock.haustur
        name: Haustür
        show_name: true
        show_state: true
        show_icon: true
        color: red
        visibility:
          - condition: state
            entity: lock.haustur
            state_not: locked
      - type: entity
        entity: binary_sensor.siemens_ki86nhdf0_68a40ea34a75_refrigeration_common_status_door_refrigerator
        name: Kühlschrank
        show_name: false
        show_state: true
        show_icon: true
        color: red
        icon: mdi:fridge-alert
        visibility:
          - condition: state
            entity: binary_sensor.siemens_ki86nhdf0_68a40ea34a75_refrigeration_common_status_door_refrigerator
            state: "on"
      - type: entity
        entity: binary_sensor.siemens_ki86nhdf0_68a40ea34a75_refrigeration_common_status_door_freezer
        name: Gefrierfach
        show_name: false
        show_state: true
        show_icon: true
        color: red
        icon: mdi:fridge-alert
        visibility:
          - condition: state
            entity: binary_sensor.siemens_ki86nhdf0_68a40ea34a75_refrigeration_common_status_door_freezer
            state: "on"
      - type: entity
        entity: binary_sensor.alle_turen
        show_name: false
        show_state: true
        show_icon: true
        visibility:
          - condition: state
            entity: binary_sensor.alle_turen
            state_not: "off"
      - type: entity
        entity: binary_sensor.alle_fenster
        show_name: false
        show_state: true
        show_icon: true
        visibility:
          - condition: state
            entity: binary_sensor.alle_fenster
            state_not: "off"
      - type: entity
        entity: sensor.dishwasher_verbleibende_zeit
        name: Spülmaschine
        icon: mdi:dishwasher
        show_name: true
        show_state: true
        show_icon: true
        visibility:
          - condition: state
            entity: binary_sensor.spulmaschine_lauft
            state: "on"
      - type: entity
        entity: vacuum.rocky
        name: Rocky
        icon: mdi:robot-vacuum
        show_name: true
        show_state: true
        show_icon: true
        visibility:
          - condition: state
            entity: vacuum.rocky
            state_not: docked
      - type: entity
        entity: binary_sensor.rocky_dock_frischwassertank
        name: "Rocky: Wasser füllen"
        icon: mdi:water-plus
        color: blue
        show_name: true
        show_state: false
        show_icon: true
        visibility:
          - condition: state
            entity: binary_sensor.rocky_dock_frischwassertank
            state: "on"
      - type: entity
        entity: binary_sensor.rocky_dock_schmutzwassertank
        name: "Rocky: Schmutzwasser leeren"
        icon: mdi:water-remove
        color: brown
        show_name: true
        show_state: false
        show_icon: true
        visibility:
          - condition: state
            entity: binary_sensor.rocky_dock_schmutzwassertank
            state: "on"
      - type: entity
        entity: timer.bewaesserung
        name: Bewässerung
        icon: mdi:sprinkler-variant
        show_name: true
        show_state: true
        show_icon: true
        visibility:
          - condition: state
            entity: timer.bewaesserung
            state: active
      - type: entity
        entity: input_boolean.urlaubsmodus
        name: Urlaubsmodus
        icon: mdi:airplane
        color: orange
        show_name: true
        show_state: false
        show_icon: true
        visibility:
          - condition: state
            entity: input_boolean.urlaubsmodus
            state: "on"
      - type: entity
        entity: binary_sensor.outdoor_kamera_person
        name: Person im Garten
        icon: mdi:account-alert
        color: red
        show_name: true
        show_state: false
        show_icon: true
        tap_action:
          action: navigate
          navigation_path: "#garten"
        visibility:
          - condition: state
            entity: binary_sensor.outdoor_kamera_person
            state: "on"
      - type: shortcut
        text: Wartung fällig
        icon: mdi:wrench-clock
        color: amber
        tap_action:
          action: navigate
          navigation_path: /lovelace/system
        visibility:
          - condition: or
            conditions:
              - condition: numeric_state
                entity: sensor.rocky_verbleibende_zeit_der_hauptburste
                below: 0
              - condition: numeric_state
                entity: sensor.rocky_verbleibende_zeit_der_seitenburste
                below: 0
              - condition: numeric_state
                entity: sensor.rocky_verbleibende_filterzeit
                below: 0
              - condition: numeric_state
                entity: sensor.rocky_verbleibende_sensorzeit
                below: 0
              - condition: numeric_state
                entity: sensor.rocky_dock_schmutzfanger_verbleibend
                below: 0
              - condition: numeric_state
                entity: sensor.rocky_dock_burstenwartung_verbleibend
                below: 0
              - condition: numeric_state
                entity: sensor.robo_main_brush_time_left
                below: 0
              - condition: numeric_state
                entity: sensor.robo_side_brush_time_left
                below: 0
              - condition: numeric_state
                entity: sensor.robo_filter_time_left
                below: 0
              - condition: numeric_state
                entity: sensor.robo_sensor_time_left
                below: 0
      - type: entity
        entity: sensor.verfugbare_updates
        name: Updates
        icon: mdi:package-up
        color: green
        show_name: true
        show_state: true
        show_icon: true
        tap_action:
          action: navigate
          navigation_path: /config/updates
        visibility:
          - condition: numeric_state
            entity: sensor.verfugbare_updates
            above: 0
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
