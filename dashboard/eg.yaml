- title: Küche
  path: kuche
  icon: mdi:chef-hat
  type: sections
  max_columns: 4
  subview: true
  back_path: /dashboard-eg/eg
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Lampen
    - type: tile
      entity: light.barlampe
      state_content: last_changed
      grid_options:
        columns: full
        rows: 1
    - type: tile
      entity: light.arbeitsplatte_light
      state_content: last_changed
      grid_options:
        columns: full
        rows: 1
    - type: tile
      entity: light.kuche_deckenlampe
      name: Deckenlampe
      state_content: last_changed
      grid_options:
        columns: full
        rows: 1
  - type: grid
    cards:
    - type: heading
      heading: Küchengeräte
      heading_style: title
    - type: tile
      entity: sensor.siemens_ex877lx57e_68a40e85448b_bsh_common_status_operationstate
      name: Herd Status
      icon: mdi:power
      grid_options:
        columns: full
        rows: 1
    - type: tile
      entity: sensor.siemens_hm836gpb6_68a40e861dae_bsh_common_status_operationstate
      name: Backofen Status
      grid_options:
        columns: full
        rows: 1
    - type: tile
      entity: sensor.012080386789002428_bsh_common_status_operationstate
      name: Spülmaschine Status
      grid_options:
        columns: full
        rows: 1
    - type: tile
      entity: sensor.012080386789002428_bsh_common_option_remainingprogramtime
      name: Spülmaschine – verbleibende Zeit
      grid_options:
        columns: full
        rows: 1
      visibility:
      - condition: state
        entity: binary_sensor.spulmaschine_lauft
        state: 'on'
    - type: history-graph
      entities:
      - entity: sensor.siemens_hm836gpb6_68a40e861dae_bsh_common_setting_powerstate
        name: Backofen
      - entity: sensor.siemens_ex877lx57e_68a40e85448b_bsh_common_setting_powerstate
        name: Herd
      logarithmic_scale: false
      hours_to_show: 168
  - type: grid
    cards:
    - type: heading
      heading: Backofen vorheizen
      icon: mdi:stove
      heading_style: title
      badges:
      - type: entity
        entity: sensor.siemens_hm836gpb6_68a40e861dae_cooking_oven_status_currentcavitytemperature
        show_state: true
        show_icon: true
        icon: mdi:thermometer
    - type: tile
      entity: script.backofen_vorheizen_brotchen
      name: Brötchen
      icon: mdi:baguette
      grid_options:
        columns: 6
        rows: 2
      vertical: true
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.backofen_vorheizen_brotchen
        confirmation:
          text: Backofen mit Heißluft auf 200 °C vorheizen?
      icon_tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.backofen_vorheizen_brotchen
        confirmation:
          text: Backofen mit Heißluft auf 200 °C vorheizen?
      hide_state: true
    - type: tile
      entity: script.backofen_vorheizen_pizza
      name: Pizza
      icon: mdi:pizza
      grid_options:
        columns: 6
        rows: 2
      vertical: true
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.backofen_vorheizen_pizza
        confirmation:
          text: Backofen mit Pizzastufe auf 180 °C vorheizen?
      icon_tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.backofen_vorheizen_pizza
        confirmation:
          text: Backofen mit Pizzastufe auf 180 °C vorheizen?
      hide_state: true
    - type: tile
      entity: button.siemens_hm836gpb6_68a40e861dae_stop
      name: Backofen stoppen
      icon: mdi:stop-circle-outline
      grid_options:
        columns: full
        rows: 1
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.siemens_hm836gpb6_68a40e861dae_stop
      icon_tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.siemens_hm836gpb6_68a40e861dae_stop
      visibility:
      - condition: state
        entity: sensor.siemens_hm836gpb6_68a40e861dae_bsh_common_status_operationstate
        state: BSH.Common.EnumType.OperationState.Run
      hide_state: true
