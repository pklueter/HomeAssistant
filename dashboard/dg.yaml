title: Dachgeschoss
views:
- title: Dachgeschoss
  path: dg
  icon: mdi:home-roof
  type: sections
  max_columns: 3
  dense_section_placement: true
  header:
    layout: center
    card:
      type: markdown
      text_only: true
      content: |
        # Dachgeschoss
        [Erdgeschoss](/dashboard-eg/eg) · [1. Obergeschoss](/dashboard-og/og)
  sections:
  - type: grid
    cards:
    - type: heading
      icon: mdi:chair-rolling
      heading: Lauras Büro
      heading_style: title
      badges:
      - type: entity
        entity: binary_sensor.fenster_lauras_buro
        show_state: true
        show_icon: true
        visibility:
        - condition: state
          entity: binary_sensor.fenster_lauras_buro
          state: 'on'
      - type: entity
        entity: sensor.tado_smart_thermostat_ru0690373120_current_temperature
    - type: tile
      entity: light.lauras_buro_deckenlampe
      name: Deckenlampe
      icon: mdi:ceiling-light
      grid_options:
        columns: 6
        rows: 1
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      visibility:
      - condition: state
        entity: light.lauras_buro_deckenlampe
        state_not: unavailable
    - type: tile
      entity: light.schreibtisch
      name: Schreibtisch
      icon: mdi:desk-lamp
      grid_options:
        columns: 6
        rows: 1
      tap_action:
        action: toggle
      hold_action:
        action: more-info
    - type: tile
      entity: cover.lauras_buro_gross_2
      name: Rollladen groß
      grid_options:
        columns: 6
        rows: 2
      features_position: bottom
      features:
      - type: cover-open-close
    - type: tile
      entity: cover.lauras_buro_klein_2
      name: Rollladen klein
      grid_options:
        columns: 6
        rows: 2
      features_position: bottom
      features:
      - type: cover-open-close
  - type: grid
    cards:
    - type: heading
      icon: mdi:yoga
      heading: Sportzimmer
      heading_style: title
      badges:
      - type: entity
        entity: binary_sensor.fenster_sportzimmer
        show_state: true
        show_icon: true
        visibility:
        - condition: state
          entity: binary_sensor.fenster_sportzimmer
          state: 'on'
      - type: entity
        entity: sensor.tado_smart_thermostat_ru0630216448_current_temperature
    - type: tile
      entity: light.deckenlampe_sportzimmer_light_2
      name: Deckenlampe
      icon: mdi:ceiling-light
      grid_options:
        columns: 6
        rows: 1
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      visibility:
      - condition: state
        entity: light.deckenlampe_sportzimmer_light_2
        state_not: unavailable
    - type: tile
      entity: switch.sportzimmer_sportzimmer
      name: Steckdose
      icon: mdi:power-socket-de
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: cover.sportzimmer_gross_2
      name: Rollladen groß
      grid_options:
        columns: 6
        rows: 2
      features_position: bottom
      features:
      - type: cover-open-close
    - type: tile
      entity: cover.sportzimmer_klein_2
      name: Rollladen klein
      grid_options:
        columns: 6
        rows: 2
      features_position: bottom
      features:
      - type: cover-open-close
  - type: grid
    cards:
    - type: heading
      icon: mdi:bathtub
      heading: Badezimmer
      heading_style: title
      badges:
      - type: entity
        entity: binary_sensor.fenstersensor_bad_dg_opening
        show_state: true
        show_icon: true
        visibility:
        - condition: state
          entity: binary_sensor.fenstersensor_bad_dg_opening
          state: 'on'
      - type: entity
        entity: sensor.tado_smart_thermostat_ru0673595904_current_temperature
  - type: grid
    cards:
    - type: heading
      icon: mdi:stairs
      heading: Treppenhaus
      heading_style: title
      badges:
      - type: entity
        entity: binary_sensor.treppenhaus_bewegungsmelder_treppenhaus_dg_belegung
        show_state: true
        show_icon: true
        visibility:
        - condition: state
          entity: binary_sensor.treppenhaus_bewegungsmelder_treppenhaus_dg_belegung
          state: 'on'
    - type: tile
      entity: light.deckenlampe_treppenhaus
      name: Deckenlampe
      icon: mdi:ceiling-light
      tap_action:
        action: toggle
      hold_action:
        action: more-info
    - type: tile
      entity: light.liane_light
      name: Liane
      icon: mdi:string-lights
      tap_action:
        action: toggle
      hold_action:
        action: more-info
  - type: grid
    cards:
    - type: heading
      icon: mdi:home-roof
      heading: Dachboden
      heading_style: title
      badges:
      - type: entity
        entity: binary_sensor.dachboden_dachbodentur_tur
        show_state: true
        show_icon: true
        visibility:
        - condition: state
          entity: binary_sensor.dachboden_dachbodentur_tur
          state: 'on'
      - type: entity
        entity: sensor.feuchtigkeitssensor_humidity
        show_state: true
        show_icon: true
        visibility:
        - condition: state
          entity: sensor.feuchtigkeitssensor_humidity
          state_not: unavailable
    - type: tile
      entity: light.dachboden_deckenlampe_dachboden
      name: Deckenlampe
      icon: mdi:ceiling-light
      grid_options:
        columns: full
        rows: 1
      tap_action:
        action: toggle
      hold_action:
        action: more-info
  - type: grid
    cards:
    - type: heading
      icon: mdi:solar-power-variant
      heading: Solar
      heading_style: title
      badges:
      - type: entity
        entity: sensor.ecu_216000266768_current_power
        show_state: true
        show_icon: true
    - type: tile
      entity: sensor.ecu_216000266768_today_energy
      name: Heute
      icon: mdi:solar-power
    - type: tile
      entity: sensor.ecu_216000266768_lifetime_energy
      name: Gesamt
      icon: mdi:counter
    - type: custom:mini-graph-card
      name: Aktuelle Produktion
      entities:
      - sensor.ecu_216000266768_current_power
      points_per_hour: 4
      hours_to_show: 24
      line_color: '#f5a623'
      grid_options:
        columns: full
