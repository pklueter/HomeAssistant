title: Dachgeschoss
views:
  - title: Dachgeschoss
    path: dg
    icon: mdi:home-roof
    type: sections
    max_columns: 3
    dense_section_placement: false
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Lauras Büro
            icon: mdi:chair-rolling
            sub_button:
              main:
                - entity: binary_sensor.fenster_lauras_buro
                  icon: mdi:window-open-variant
                  show_background: false
                  visibility:
                    - condition: state
                      entity: binary_sensor.fenster_lauras_buro
                      state: "on"
                - entity: sensor.tado_smart_thermostat_ru0690373120_current_temperature
                  icon: mdi:thermometer
                  show_background: false
                  state_content: state
                - icon: mdi:dots-horizontal
                  show_background: false
                  tap_action:
                    action: navigate
                    navigation_path: "#lauras-buero"
            styles: >-
              * { --bubble-accent-color: #FFB300 !important; --accent-color:
              #FFB300 !important; --bubble-climate-accent-color: #FFB300
              !important; }
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: light.lauras_buro_deckenlampe
            name: Decke
            icon: mdi:ceiling-light
            grid_options:
              columns: 6
            use_accent_color: true
            styles: >-
              * { --bubble-accent-color: #FFB300 !important; --accent-color:
              #FFB300 !important; --bubble-climate-accent-color: #FFB300
              !important; }
